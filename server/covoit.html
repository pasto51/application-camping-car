<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f1ea">
<title>On parle de quoi ?</title>
<style>
  :root { --bg:#f6f1ea; --card:#fff; --ink:#2b2622; --soft:#7a7068; --line:#e7dfd5; --me:#e86a3a; --them:#3a7be8; --ok:#2f9e6b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --card:#292522; --ink:#f3eee8; --soft:#a89f96; --line:#3a3430; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px 16px 60px; }
  h1 { font-size:26px; margin:8px 0 2px; }
  .sub { color:var(--soft); margin:0 0 16px; font-size:14px; }
  .sub button { font-size:14px; padding:0; border:0; background:none; color:var(--soft); text-decoration:underline; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin:0 0 14px; }
  .card h2 { font-size:18px; margin:0 0 10px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  h3 { font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--soft); margin:14px 0 6px; }
  button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 12px; }
  .primary { background:var(--me); border-color:var(--me); color:#fff; font-weight:600; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .kinds button[aria-pressed=true] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  input[type=text], input[type=date], textarea { font:inherit; width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
  input[type=date] { width:auto; }
  .inputs { display:grid; gap:6px; }
  .inputs .picked { border-color:var(--them); box-shadow:0 0 0 2px color-mix(in srgb, var(--them) 30%, transparent); }
  .choice { display:block; width:100%; text-align:left; margin:0 0 6px; padding:10px 12px; }
  .choice.on { background:var(--them); border-color:var(--them); color:#fff; font-weight:600; }
  .choice.on::before { content:"✓ "; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:14px; padding:5px 10px; border-radius:999px; background:var(--bg); }
  .result { background:color-mix(in srgb, var(--ok) 12%, var(--card)); border:1px solid color-mix(in srgb, var(--ok) 40%, var(--line)); border-radius:12px; padding:10px 12px; margin-bottom:6px; }
  .result b { display:block; font-size:17px; }
  .result small { color:var(--soft); }
  .result .row { margin-top:6px; }
  .result button { font-size:13px; padding:4px 9px; }
  .result.st-done b { text-decoration:line-through; opacity:.6; }
  .muted { color:var(--soft); font-size:14px; }
  .del { border:0; background:none; color:var(--soft); font-size:13px; padding:4px; }
  details > summary { cursor:pointer; color:var(--soft); margin:6px 0 12px; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<main>
  <h1>On parle de quoi&nbsp;?</h1>
  <p class="sub" id="hello"></p>

  <div class="card" id="later-card" hidden>
    <h2>🔁 On en reparle</h2>
    <p class="muted">Sujets pas finis : touche-en un dans tes propositions pour le reprendre.</p>
    <div class="chips" id="later"></div>
  </div>

  <div class="card">
    <h2>Nouveau rendez-vous</h2>
    <div class="row kinds" id="kinds">
      <button data-k="covoit" aria-pressed="true">🚗 Covoit</button>
      <button data-k="bar" aria-pressed="false">🍻 Bar</button>
      <button data-k="midi" aria-pressed="false">🍽️ Midi</button>
    </div>
    <div class="row" style="margin-top:10px">
      <input type="date" id="date">
      <button class="primary" id="create">Créer</button>
    </div>
  </div>

  <div id="meets"></div>
  <details id="old-wrap" hidden><summary>Rendez-vous passés</summary><div id="old"></div></details>

  <div class="card">
    <h2>💡 Ma réserve d'idées</h2>
    <p class="muted">Une idée par ligne, rien que pour toi. Touche une idée sous tes propositions pour l'utiliser.</p>
    <textarea id="ideas" rows="5"></textarea>
    <div class="row" style="margin-top:8px"><button id="save-ideas">Enregistrer</button></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const API = location.pathname.replace(/\/?$/, '/') + 'api';
const KIND = { covoit: { icon: '🚗', label: 'Covoit', note: 'le matin, et on continue le soir' }, bar: { icon: '🍻', label: 'Bar' }, midi: { icon: '🍽️', label: 'Repas du midi' } };
let S = null;
let kind = 'covoit';
let dirty = false; // un champ en cours d'écriture : on ne redessine pas sous les doigts

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const tomorrow = () => { const d = new Date(Date.now() + 864e5); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmt = (iso) => new Date(iso + 'T12:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1600); }

async function call(body) {
  try {
    const r = await fetch(API, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Erreur');
    S = await r.json();
    render();
    return true;
  } catch (e) { toast('⚠️ ' + e.message); return false; }
}

function resultBlock(m, topic, by) {
  const st = m.done[topic] || '';
  return `<div class="result st-${st}">
    <small>${by}</small><b>${esc(topic)}</b>
    <div class="row">
      <button data-done="${m.id}" data-t="${esc(topic)}" data-s="${st === 'done' ? '' : 'done'}">${st === 'done' ? '↩︎ pas fini' : '✓ fini'}</button>
      <button data-done="${m.id}" data-t="${esc(topic)}" data-s="${st === 'later' ? '' : 'later'}">${st === 'later' ? '✗ ne plus reprendre' : '🔁 à reprendre'}</button>
    </div></div>`;
}

function meetCard(m) {
  const k = KIND[m.kind] || KIND.covoit;
  const me = S.names.me, them = S.names.them;
  const mineChosen = m.theirPick != null ? m.mine[m.theirPick] : null;
  const theirsChosen = m.myPick != null ? m.theirs[m.myPick] : null;
  let res = '';
  if (mineChosen || theirsChosen) {
    res = `<h3>On parle de</h3>` +
      (mineChosen ? resultBlock(m, mineChosen, `ton sujet, choisi par ${esc(them)}`) : '') +
      (theirsChosen ? resultBlock(m, theirsChosen, `son sujet, choisi par toi`) : '');
    if (!mineChosen) res += `<p class="muted">⏳ ${esc(them)} n'a pas encore choisi parmi tes sujets.</p>`;
  }
  const inputs = [0, 1, 2, 3].map((i) => `<input type="text" maxlength="160" data-in="${m.id}" value="${esc(m.mine[i] || '')}" placeholder="Sujet ${i + 1}" class="${m.theirPick === i ? 'picked' : ''}">`).join('');
  const sugg = [...S.later, ...S.ideas].filter((t, i, a) => a.indexOf(t) === i && !m.mine.includes(t));
  const choices = m.theirs.length
    ? m.theirs.map((t, i) => `<button class="choice ${m.myPick === i ? 'on' : ''}" data-pick="${m.id}" data-i="${m.myPick === i ? '' : i}">${esc(t)}</button>`).join('')
    : `<p class="muted">${esc(them)} n'a pas encore proposé ses sujets.</p>`;
  return `<div class="card" data-meet="${m.id}">
    <h2><span>${k.icon} ${k.label} · ${fmt(m.date)}</span><button class="del" data-del="${m.id}" title="Supprimer">🗑</button></h2>
    ${k.note ? `<p class="muted" style="margin:-6px 0 4px">${k.note}</p>` : ''}
    ${res}
    <h3>Ses sujets — choisis-en un</h3>
    ${choices}
    <h3>Tes 4 sujets pour ${esc(them)}</h3>
    <div class="inputs">${inputs}</div>
    ${sugg.length ? `<div class="chips" style="margin-top:8px">${sugg.slice(0, 12).map((t) => `<button class="chip" data-use="${m.id}" data-t="${esc(t)}">+ ${esc(t)}</button>`).join('')}</div>` : ''}
    <div class="row" style="margin-top:8px"><button class="primary" data-save="${m.id}">Envoyer mes sujets</button>
    ${m.theirPick != null ? `<span class="muted">✓ ${esc(them)} a choisi « ${esc(mineChosen)} »</span>` : ''}</div>
  </div>`;
}

function render() {
  if (!S || dirty) return;
  $('hello').innerHTML = `Toi : <b>${esc(S.names.me)}</b> · avec ${esc(S.names.them)} — <button id="rename">changer mon prénom</button>`;
  $('later-card').hidden = !S.later.length;
  $('later').innerHTML = S.later.map((t) => `<span class="chip">${esc(t)} <button class="del" data-unlater="${esc(t)}" title="Retirer">✕</button></span>`).join('');
  const now = today();
  const up = S.meets.filter((m) => m.date >= now).reverse(); // le plus proche d'abord
  const old = S.meets.filter((m) => m.date < now);
  $('meets').innerHTML = up.length ? up.map(meetCard).join('') : '<p class="muted" style="text-align:center">Aucun rendez-vous prévu : crée le prochain juste au-dessus.</p>';
  $('old-wrap').hidden = !old.length;
  $('old').innerHTML = old.map(meetCard).join('');
  if (document.activeElement !== $('ideas')) $('ideas').value = S.ideas.join('\n');
}

function readInputs(id) { return [...document.querySelectorAll(`[data-in="${id}"]`)].map((i) => i.value.trim()).filter(Boolean); }

document.addEventListener('input', (e) => { if (e.target.matches('[data-in]')) dirty = true; });

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.k) {
    kind = b.dataset.k;
    document.querySelectorAll('#kinds button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  } else if (b.id === 'create') {
    if (await call({ action: 'create', kind, date: $('date').value })) toast('Rendez-vous créé');
  } else if (b.id === 'rename') {
    const n = prompt('Ton prénom ?', S.names.me);
    if (n != null) call({ action: 'name', name: n });
  } else if (b.id === 'save-ideas') {
    if (await call({ action: 'ideas', ideas: $('ideas').value.split('\n') })) toast('Idées enregistrées');
  } else if (b.dataset.save) {
    dirty = false;
    if (await call({ action: 'topics', id: b.dataset.save, topics: readInputs(b.dataset.save) })) toast('Sujets envoyés 📨');
  } else if (b.dataset.use) {
    const empty = [...document.querySelectorAll(`[data-in="${b.dataset.use}"]`)].find((i) => !i.value.trim());
    if (!empty) return toast('Tes 4 cases sont pleines');
    empty.value = b.dataset.t; dirty = true; b.remove();
  } else if (b.dataset.pick) {
    if (dirty) return toast('Envoie d’abord tes sujets');
    call({ action: 'pick', id: b.dataset.pick, index: b.dataset.i === '' ? null : Number(b.dataset.i) });
  } else if (b.dataset.done) {
    if (dirty) return toast('Envoie d’abord tes sujets');
    call({ action: 'done', id: b.dataset.done, topic: b.dataset.t, state: b.dataset.s });
  } else if (b.dataset.del) {
    if (confirm('Supprimer ce rendez-vous pour vous deux ?')) { dirty = false; call({ action: 'remove', id: b.dataset.del }); }
  } else if (b.dataset.unlater) {
    call({ action: 'unlater', topic: b.dataset.unlater });
  }
});

$('date').value = tomorrow();
call();
// Les choix de l'autre arrivent tout seuls.
setInterval(() => { if (!dirty && document.visibilityState === 'visible') call(); }, 5000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !dirty) call(); });
</script>
</body>
</html>
