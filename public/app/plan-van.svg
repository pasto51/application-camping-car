<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Helvetica, Arial, sans-serif">
  <!-- Plan schématique d'un van vu du dessus, cabine à droite. Les zones correspondent aux 10 numéros de l'appli. -->
  <rect width="800" height="360" fill="#f3f7f6"/>
  <!-- Roues -->
  <g fill="#3d5a60">
    <rect x="95" y="34" width="70" height="18" rx="6"/>
    <rect x="95" y="308" width="70" height="18" rx="6"/>
    <rect x="590" y="34" width="70" height="18" rx="6"/>
    <rect x="590" y="308" width="70" height="18" rx="6"/>
  </g>
  <!-- Carrosserie : cellule + cabine -->
  <path d="M42 46 H690 C735 46 772 62 782 110 V250 C772 298 735 314 690 314 H42 A14 14 0 0 1 28 300 V60 A14 14 0 0 1 42 46 Z" fill="#ffffff" stroke="#0c2b33" stroke-width="4"/>
  <!-- Pare-brise et tableau de bord -->
  <path d="M752 86 C770 120 770 240 752 274" fill="none" stroke="#7fb6bd" stroke-width="10" stroke-linecap="round"/>
  <rect x="722" y="96" width="18" height="168" rx="6" fill="#dfe9e8"/>
  <!-- Sièges avant pivotants -->
  <g fill="#dff1ef" stroke="#0a7c82" stroke-width="2">
    <rect x="640" y="72" width="62" height="70" rx="14"/>
    <rect x="640" y="218" width="62" height="70" rx="14"/>
  </g>
  <g fill="none" stroke="#0a7c82" stroke-width="2" stroke-dasharray="4 4">
    <path d="M630 107 a40 40 0 0 0 -22 36"/>
    <path d="M630 253 a40 40 0 0 1 -22 -36"/>
  </g>
  <!-- Lit arrière en travers -->
  <rect x="40" y="58" width="190" height="244" rx="10" fill="#e9f3f2" stroke="#0a7c82" stroke-width="2"/>
  <rect x="50" y="70" width="44" height="100" rx="10" fill="#ffffff" stroke="#9bbcc0" stroke-width="2"/>
  <rect x="50" y="190" width="44" height="100" rx="10" fill="#ffffff" stroke="#9bbcc0" stroke-width="2"/>
  <line x1="110" y1="64" x2="110" y2="296" stroke="#9bbcc0" stroke-width="1.5" stroke-dasharray="6 6"/>
  <!-- Salle d'eau -->
  <rect x="250" y="58" width="160" height="92" rx="8" fill="#eef4fb" stroke="#0a7c82" stroke-width="2"/>
  <rect x="262" y="68" width="62" height="72" rx="6" fill="#ffffff" stroke="#9bbcc0" stroke-width="2"/>
  <circle cx="293" cy="104" r="6" fill="#9bbcc0"/>
  <ellipse cx="370" cy="104" rx="20" ry="26" fill="#ffffff" stroke="#9bbcc0" stroke-width="2"/>
  <!-- Lanterneau (toit) -->
  <rect x="285" y="182" width="96" height="64" rx="8" fill="none" stroke="#0a7c82" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- Cuisine : plan de travail, évier, plaque -->
  <rect x="330" y="252" width="210" height="50" rx="6" fill="#fdf3e3" stroke="#b7791f" stroke-width="2"/>
  <rect x="348" y="262" width="44" height="30" rx="6" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
  <circle cx="470" cy="277" r="10" fill="none" stroke="#b7791f" stroke-width="2"/>
  <circle cx="505" cy="277" r="10" fill="none" stroke="#b7791f" stroke-width="2"/>
  <!-- Frigo, sous la plaque -->
  <rect x="420" y="256" width="26" height="42" rx="4" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/>
  <!-- Dinette : banquette (technique dessous) et table -->
  <rect x="440" y="58" width="68" height="96" rx="10" fill="#dff1ef" stroke="#0a7c82" stroke-width="2"/>
  <rect x="520" y="70" width="80" height="62" rx="8" fill="#ffffff" stroke="#9bbcc0" stroke-width="2"/>
  <!-- Porte latérale et marchepied -->
  <rect x="556" y="306" width="74" height="16" fill="#f3f7f6"/>
  <line x1="556" y1="314" x2="630" y2="314" stroke="#0a7c82" stroke-width="4" stroke-dasharray="10 6"/>
  <rect x="566" y="320" width="54" height="8" rx="3" fill="#9bbcc0"/>
  <!-- Repères texte -->
  <g fill="#4d6a70" font-size="13" font-weight="700" text-anchor="middle">
    <text x="160" y="295">LIT ARRIÈRE · SOUTE</text>
    <text x="330" y="166">SALLE D'EAU</text>
    <text x="435" y="246">CUISINE</text>
    <text x="560" y="168">DINETTE</text>
    <text x="671" y="160">CABINE</text>
    <text x="540" y="340">PORTE</text>
  </g>
  <g fill="#9bbcc0" font-size="11" text-anchor="middle">
    <text x="400" y="20">côté opposé à la porte</text>
    <text x="400" y="352">côté porte</text>
  </g>
</svg>
